name: Publish Python distribution to PyPI

on:
  workflow_dispatch:

permissions: {}

jobs:
  verify-release-asset:
    name: Verify and stage the GitHub Release wheel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run the contract and unit tests
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_m0_contract.py
      - name: Download the pinned GitHub Release wheel
        run: |
          python scripts/fetch_verified_runtime_release.py \
            --plugin-root "$GITHUB_WORKSPACE" \
            --output-dir dist
      - name: Upload the verified wheel for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: verified-python-wheel
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish distributions to PyPI
    needs: verify-release-asset
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download verified wheel
        uses: actions/download-artifact@v4
        with:
          name: verified-python-wheel
          path: dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
